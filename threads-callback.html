<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aiylin Music - Threads Bağlantısı</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #1b0f0a;
      color: #fff;
    }
    main {
      width: min(560px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid #6d4a34;
      border-radius: 16px;
      background: #211714;
      box-sizing: border-box;
    }
    h1 { margin-top: 0; color: #f0aa52; }
    p { line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #f0aa52;
      color: #1b0f0a;
      font-weight: 700;
      text-decoration: none;
    }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Aiylin Music</h1>
    <p id="status">Threads bağlantısı yerel panele aktarılıyor…</p>
    <a id="manual" href="http://127.0.0.1:8765/threads/callback/" hidden>
      Panele dön
    </a>
  </main>

  <script>
    (() => {
      const localCallback = "http://127.0.0.1:8765/threads/callback/";
      const destination = localCallback + window.location.search;
      const manual = document.getElementById("manual");
      const status = document.getElementById("status");

      manual.href = destination;

      if (!window.location.search) {
        status.textContent =
          "Threads doğrulama bilgisi bulunamadı. Aiylin Music panelinden yeniden bağlanın.";
        manual.hidden = false;
        return;
      }

      setTimeout(() => {
        window.location.replace(destination);
      }, 500);

      setTimeout(() => {
        status.textContent =
          "Panel açılmadıysa Aiylin Music programının çalıştığını kontrol edin ve aşağıdaki düğmeye basın.";
        manual.hidden = false;
      }, 2500);
    })();
  </script>
</body>
</html>
